# this is used to run nginx on localhost with docker for fun :)
# use nginx.backup.conf for production config /etc/nginx/sites-available/default

events {

}

http {
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name api.cinesnap.route53.fasilv.in;

        location / {
            proxy_pass http://cinesnap-api:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

