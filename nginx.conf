# Basic Nginx config for deployment

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # No domain mapping, use EC2 public IP directly
    server_name _; # Replace it with domain if have one

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

#? /etc/nginx/sites-available/default - Replace this file with NGINX config while deploying
