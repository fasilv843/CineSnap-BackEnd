name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - "Build and Push Docker Image"
    types:
      - completed
    branches:
      - cicd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # git clone https://github.com/fasilv843/CineSnap-BackEnd.git app - use this command to clone to keep the dir name as app
            cd ~/app || exit 1

            # Pull the latest code (includes updated docker-compose.yml if changed)
            git fetch origin
            git reset --hard origin/cicd   # or 'main' if that's your deploy branch

            # Deploy latest Docker images
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml pull
            docker image prune -f
